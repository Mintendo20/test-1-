name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Personal Life OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Personal-Life-OS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Life-OS-APK
          path: Personal-Life-OS.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk Personal-Life-OS.apk \
            --target "${{ github.sha }}" \
            --title "Personal Life OS — Android APK" \
            --notes "Готовий інсталяційний файл Personal Life OS для Android. Натисніть на Personal-Life-OS.apk нижче, щоб завантажити файл прямо на телефон без комп'ютера."
